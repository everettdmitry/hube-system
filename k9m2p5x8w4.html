<!DOCTYPE html>
<html>
<head>
    <title>LAB ARCHIVE // SECURITY PROFILE</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-box {
            border: 2px solid #00ff41;
            padding: 40px 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15);
            background-color: #0a0a0a;
        }

        .profile-box h1 {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 12px;
            margin-top: 0;
        }

        .field {
            margin: 12px 0;
            padding: 10px 12px;
            border: 1px solid #00aa33;
            background-color: #050505;
            display: flex;
            flex-direction: column;
        }

        .field .label {
            font-size: 12px;
            color: #005522;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .field .value {
            font-size: 18px;
            color: #00ff41;
            letter-spacing: 1px;
        }

        .field .value.empty {
            color: #003311;
            font-style: italic;
        }

        .field .value.redacted {
            color: #ff2244;
            opacity: 0.5;
            letter-spacing: 6px;
        }

        /* Статус увольнения */
        .status-terminated {
            color: #ff2244;
            text-shadow: 0 0 5px #ff2244;
            font-weight: bold;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #005522;
            margin-top: 25px;
            opacity: 0.4;
            letter-spacing: 1px;
            border-top: 1px solid #003311;
            padding-top: 15px;
        }

        .cursor-blink {
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .system-line {
            text-align: center;
            font-size: 12px;
            color: #005522;
            margin-top: 15px;
            opacity: 0.5;
        }

        .ascii-divider {
            text-align: center;
            font-size: 10px;
            color: #003311;
            opacity: 0.3;
            margin: 10px 0;
            letter-spacing: 2px;
        }
    </style>
</head>
